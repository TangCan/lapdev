name: Runtime Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  package-cli:
    name: Validate npm CLI package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm version with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check CLI and repository versions
        run: test "$(node -p "require('./cli/package.json').version")" = "$(node -p "require('./package.json').version")"
      - name: Run packed npx install and smoke test
        run: deno test --allow-all tests/unit/cli-6-6.test.ts
      - name: Prepare npm package artifact directory
        run: mkdir -p _npm
      - name: Pack CLI
        run: npm pack ./cli --pack-destination _npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-cli
          path: _npm/*.tgz
          if-no-files-found: error

  build-runtime:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check release version on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Build runtime archive
        run: RUNTIME_OUTPUT_DIR="$GITHUB_WORKSPACE/_agile-output/runtime-archives" ./scripts/build-runtime-archive.sh "${{ matrix.target }}"
      - name: Verify runtime archive
        run: ./scripts/verify-runtime-archive.sh "_agile-output/runtime-archives/lapdev-runtime-$(node -p "require('./package.json').version")-${{ matrix.target }}.tar.gz" "${{ matrix.target }}"
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: _agile-output/runtime-archives/*.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: _release
          merge-multiple: true
      - name: Generate manifest and checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-runtime-release-manifest.mjs _release _release
      - name: Create immutable release or fail on existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" _release/*
          else
            gh release create "$GITHUB_REF_NAME" _release/* --verify-tag --generate-notes
          fi

  verify-release:
    name: Verify Published Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'lapdev-runtime-*.tar.gz' --pattern 'runtime-manifest.json' --dir _release
      - name: Verify release manifest and checksums
        run: node scripts/verify-runtime-release.mjs _release

  publish-cli:
    name: Publish npm CLI with Trusted Publishing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-cli, verify-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm version with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-cli
          path: _npm
      - name: Download matching runtime manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'runtime-manifest.json' --dir _release
      - name: Verify package, tag and runtime versions
        run: node scripts/verify-npm-release.mjs "$(find _npm -name '*.tgz' -print -quit)" _release/runtime-manifest.json
      - name: Publish through npm Trusted Publishing
        run: npm publish "$(find _npm -name '*.tgz' -print -quit)" --access public
