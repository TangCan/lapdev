name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: crpi-ygp4wzq7icdrlm64.cn-shenzhen.personal.cr.aliyuncs.com
  NAMESPACE: lapdev
  IMAGE_NAME: lapdev
  DENO_VERSION: 2.8.2

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Deno binary
        run: |
          curl -fsSL https://github.com/denoland/deno/releases/download/v${{ env.DENO_VERSION }}/deno-x86_64-unknown-linux-gnu.zip -o deno.zip
          unzip deno.zip
          chmod +x deno
          rm deno.zip
          ./deno --version

      - name: Run release permission gate
        run: DENO_BIN=./deno ./scripts/release-permission-gate.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          logout: false

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build image for gated health check
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USE_CN_MIRROR=false
            NPM_REGISTRY=https://registry.npmjs.org

      - name: Run gated image health check
        run: |
          IMAGE_REF="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n 1)"
          docker run -d --name lapdev-test -p 3333:3333 \
            -e DEPLOYMENT_PROFILE=remote-shared \
            -e DENO_NET_ALLOWLIST=deno.land:443,jsr.io:443 \
            "$IMAGE_REF"
          sleep 30
          docker logs lapdev-test
          for i in {1..20}; do
            if curl -f http://localhost:3333/health 2>/dev/null; then
              echo "Health check passed"
              docker stop lapdev-test
              docker rm lapdev-test
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 5
          done
          echo "Health check failed after 20 attempts"
          docker logs lapdev-test
          docker stop lapdev-test
          docker rm lapdev-test
          exit 1

      - name: Publish after health gate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r image_ref; do
            if [ -n "$image_ref" ]; then
              echo "Publishing ${image_ref}"
              timeout --signal=TERM --kill-after=30s 15m docker push "$image_ref"
            fi
          done <<'IMAGE_TAGS'
          ${{ steps.meta.outputs.tags }}
          IMAGE_TAGS
